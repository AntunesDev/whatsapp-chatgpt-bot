<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp AI Bot</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #121212;
      --fg: #e0e0e0;
      --primary: #25d366;
      --secondary: #1c1c1c;
      --border: #333;
      --bot-msg: #1f2d25;
      --user-msg: #1e1e1e;
    }

    body {
      font-family: sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: var(--primary);
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 10px 0;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0 10px 10px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--secondary);
      overflow: auto;
      max-height: 150px;
    }

    li {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    li:hover {
      background: #1e1e1e;
    }

    li.selected {
      background-color: #2e4037;
      font-weight: bold;
    }

    textarea {
      background: #1e1e1e;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      padding: 8px;
      margin-top: 15px;
      resize: vertical;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      font-size: 15px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .chat-log {
      margin-top: 20px;
      padding: 10px;
      border-radius: 10px;
      background: var(--secondary);
      border: 1px solid var(--border);
      height: 300px;
      overflow-y: auto;
    }

    .msg {
      margin: 6px 0;
      max-width: 80%;
      padding: 10px;
      border-radius: 8px;
      clear: both;
    }

    .msg.received {
      background: var(--user-msg);
      float: left;
    }

    .msg.sent {
      background: var(--bot-msg);
      float: right;
    }

    .status-line {
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>🤖 WhatsApp AI Bot</header>
  <main>
    <h2>Selecione uma conversa:</h2>
    <ul id="chat-list"></ul>

    <textarea id="prompt" rows="3" placeholder="Ex: Responda como se fosse eu..."></textarea>
    <button id="btn-toggle" disabled>⏸️ Pausar IA</button>

    <div class="status-line" id="status">IA inativa</div>

    <div class="chat-log" id="log"></div>
  </main>

  <script>
    const socket = io();
    let chatSelecionado = null;
    let iaAtiva = false;

    const btnToggle = document.getElementById("btn-toggle");
    const log = document.getElementById("log");
    const promptInput = document.getElementById("prompt");
    const status = document.getElementById("status");

    const atualizarStatus = () => {
      status.textContent = iaAtiva ? "IA ativa ✅" : "IA pausada ⏸️";
      btnToggle.textContent = iaAtiva ? "⏸️ Pausar IA" : "▶️ Ativar IA";
    };

    const addMsg = (tipo, texto) => {
      const div = document.createElement("div");
      div.className = `msg ${tipo}`;
      div.textContent = texto;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    };

    socket.on("lista_chats", (chats) => {
      const ul = document.getElementById("chat-list");
      ul.innerHTML = "";
      chats.forEach((chat) => {
        const li = document.createElement("li");
        li.textContent = chat.name;
        li.onclick = () => {
          chatSelecionado = chat.id;
          socket.emit("selecionar_chat", chat.id);
          document.querySelectorAll("li").forEach(el => el.classList.remove("selected"));
          li.classList.add("selected");
          btnToggle.disabled = false;
        };
        ul.appendChild(li);
      });
    });

    btnToggle.onclick = () => {
      socket.emit("alternar_ia");
    };

    promptInput.onchange = () => {
      socket.emit("atualizar_prompt", promptInput.value);
    };

    socket.on("estado_ia", ({ iaAtiva: ativo, promptCustomizado }) => {
      iaAtiva = ativo;
      promptInput.value = promptCustomizado;
      atualizarStatus();
    });

    socket.on("log_msg", ({ type, content }) => {
      addMsg(type === "received" ? "received" : "sent", content);
    });
  </script>
</body>
</html>
