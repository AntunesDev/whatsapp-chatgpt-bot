<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp AI Bot</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #121212;
      --fg: #e0e0e0;
      --primary: #25d366;
      --secondary: #1c1c1c;
      --border: #333;
    }

    body {
      font-family: sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: var(--primary);
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 10px 0;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--secondary);
      overflow: auto;
      max-height: 200px;
    }

    li {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    li:hover {
      background: #1e1e1e;
    }

    li.selected {
      background-color: #2e4037;
      font-weight: bold;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      font-size: 16px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    .status {
      display: flex;
      align-items: center;
      margin-top: 12px;
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      background-color: red;
      animation: pulse 1s infinite;
    }

    .dot.active {
      background-color: #25d366;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .log {
      background: #1a1a1a;
      border: 1px solid var(--border);
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      max-height: 250px;
      overflow-y: auto;
    }

    .log-entry {
      margin-bottom: 8px;
    }

    .loading {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <header>🤖 WhatsApp AI Bot</header>
  <main>
    <div id="loading" class="loading">🔄 Carregando conversas...</div>
    <h2>Selecione uma conversa:</h2>
    <ul id="chat-list"></ul>

    <button id="start-btn" disabled>Ativar IA neste chat</button>

    <div class="status">
      <div class="dot" id="dot-status"></div>
      <span id="status">IA inativa</span>
    </div>

    <div class="log" id="log">
      <strong>📝 Log de mensagens:</strong><br>
    </div>
  </main>

  <script>
    const socket = io();
    let chatSelecionado = null;

    const ul = document.getElementById("chat-list");
    const btn = document.getElementById("start-btn");
    const status = document.getElementById("status");
    const dot = document.getElementById("dot-status");
    const log = document.getElementById("log");
    const loading = document.getElementById("loading");

    const adicionarLog = (texto) => {
      const linha = document.createElement("div");
      linha.classList.add("log-entry");
      linha.textContent = texto;
      log.appendChild(linha);
      log.scrollTop = log.scrollHeight;
    };

    socket.on("lista_chats", (chats) => {
      loading.style.display = "none";
      ul.innerHTML = "";
      chats.forEach((chat) => {
        const li = document.createElement("li");
        li.textContent = chat.name;
        li.onclick = () => {
          chatSelecionado = chat.id;
          document.querySelectorAll("li").forEach(el => el.classList.remove("selected"));
          li.classList.add("selected");
          btn.disabled = false;
        };
        ul.appendChild(li);
      });
    });

    btn.onclick = () => {
      if (chatSelecionado) {
        socket.emit("selecionar_chat", chatSelecionado);
        dot.classList.add("active");
        status.textContent = "IA ativa neste chat";
        adicionarLog("🟢 IA ativada para o chat selecionado.");
      }
    };

    // Para o log de mensagens
    socket.on("log_msg", ({ type, content }) => {
      const prefix = type === "received" ? "📥" : "💬";
      adicionarLog(`${prefix} ${content}`);
    });
  </script>
</body>
</html>
